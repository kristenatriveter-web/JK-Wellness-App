<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JK Wellness</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap');

  :root {
    --bg: #FAF8F4;
    --surface: #FFFFFF;
    --surface2: #F2EFE9;
    --border: #E4DDD3;
    --text: #2C2720;
    --text-muted: #8C8178;
    --text-dim: #B8B0A7;
    --accent: #8B7355;
    --accent-light: #C4A882;
    --accent-dim: rgba(139, 115, 85, 0.08);
    --accent-border: rgba(139, 115, 85, 0.22);
    --morning: #A0794A;
    --morning-dim: rgba(160, 121, 74, 0.08);
    --evening: #6B7FA3;
    --evening-dim: rgba(107, 127, 163, 0.08);
    --workout: #5A8A6A;
    --workout-dim: rgba(90, 138, 106, 0.08);
    --workout-border: rgba(90, 138, 106, 0.25);
    --radius: 12px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Jost', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  .header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    gap: 12px;
  }

  .logo-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--text);
    padding: 0;
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--text);
    white-space: nowrap;
  }

  .logo em { font-style: italic; }

  .mode-badge {
    font-size: 10px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .mode-badge.morning { background: var(--morning-dim); color: var(--morning); border: 1px solid rgba(160,121,74,0.25); }
  .mode-badge.evening { background: var(--evening-dim); color: var(--evening); border: 1px solid rgba(107,127,163,0.25); }
  .mode-badge.workout { background: var(--workout-dim); color: var(--workout); border: 1px solid var(--workout-border); }

  /* ── MODE SCREEN ── */
  .screen { flex: 1; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  #modeScreen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px 20px;
    gap: 10px;
  }

  .greeting-block { margin-bottom: 6px; }

  .greeting-block h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    font-weight: 300;
    line-height: 1.15;
    color: var(--text);
    margin-bottom: 0;
  }

  .greeting-block h1 em { font-style: italic; color: var(--accent); }

  .mode-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    width: 100%;
    position: relative;
    font-family: 'Jost', sans-serif;
  }

  .mode-btn:hover, .mode-btn:active {
    border-color: var(--accent-border);
    box-shadow: 0 2px 12px rgba(139,115,85,0.1);
  }

  .mode-btn .btn-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .mode-btn.morning .btn-label { color: var(--morning); }
  .mode-btn.evening .btn-label { color: var(--evening); }
  .mode-btn.workout .btn-label { color: var(--workout); }

  .mode-btn .btn-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 2px;
  }

  .mode-btn .btn-desc { font-size: 13px; font-weight: 300; color: var(--text-muted); }

  .mode-btn .btn-arrow {
    position: absolute;
    right: 18px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 20px;
  }

  .divider {
    display: flex; align-items: center; gap: 10px; margin: 1px 0;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .divider span { font-size: 11px; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; }

  /* ── DATE PICKER ── */
  .date-picker-wrap { margin-bottom: 4px; }
  .date-picker-label { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 5px; display: block; }
  .date-row { display: flex; align-items: center; gap: 8px; }

  .date-display-btn {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 13px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.2s;
  }
  .date-display-btn:hover { border-color: var(--accent-border); }
  .date-display-btn .cal-icon { font-size: 13px; color: var(--text-dim); }

  .date-nav { display: flex; gap: 5px; }
  .date-nav-btn {
    width: 34px; height: 34px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer; font-size: 15px;
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .date-nav-btn:hover { border-color: var(--accent-border); color: var(--accent); }
  .date-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .date-native-input { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }

  .today-tag {
    font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-dim); border: 1px solid var(--accent-border);
    border-radius: 10px; padding: 2px 7px; margin-left: 6px;
  }

  /* ── CHECK-IN CHAT SCREEN ── */
  #chatScreen {
    flex-direction: column;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .message { max-width: 84%; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  .message.coach { align-self: flex-start; }
  .message.user { align-self: flex-end; }

  .message-bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 15px; line-height: 1.55; font-weight: 300;
  }
  .message.coach .message-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .message.user .message-bubble { background: var(--accent-dim); border: 1px solid var(--accent-border); border-bottom-right-radius: 3px; }
  .message-label { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; padding: 0 3px; }
  .message.user .message-label { text-align: right; }

  .date-display { font-size: 11px; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); text-align: center; padding: 4px 0 6px; }

  .typing-indicator { align-self: flex-start; display: none; }
  .typing-indicator.visible { display: block; }
  .typing-dots { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); border-bottom-left-radius: 3px; padding: 13px 16px; display: flex; gap: 5px; align-items: center; }
  .typing-dots span { width: 5px; height: 5px; background: var(--text-dim); border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

  .input-area { padding: 10px 14px 24px; border-top: 1px solid var(--border); background: var(--bg); display: flex; gap: 8px; align-items: flex-end; }
  .input-wrap { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; align-items: flex-end; padding: 10px 14px; transition: border-color 0.2s; }
  .input-wrap:focus-within { border-color: var(--accent-light); }
  textarea { background: none; border: none; outline: none; color: var(--text); font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 300; resize: none; width: 100%; max-height: 120px; line-height: 1.5; caret-color: var(--accent); }
  textarea::placeholder { color: var(--text-dim); }
  .send-btn { width: 42px; height: 42px; background: var(--accent); border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
  .send-btn:hover { background: var(--accent-light); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; }
  .send-btn svg { width: 16px; height: 16px; fill: white; }
  .send-btn:disabled svg { fill: var(--text-dim); }

  /* ── WORKOUT LIST SCREEN ── */
  #workoutScreen { flex-direction: column; }

  .workout-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
  }

  .workout-header-top {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;
  }

  .workout-day-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 400;
    color: var(--text);
  }

  .workout-progress {
    font-size: 12px; font-weight: 400;
    color: var(--text-muted);
  }

  .exercise-list { flex: 1; overflow-y: auto; }

  .exercise-row {
    display: flex; align-items: stretch;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    background: var(--surface);
    width: 100%;
    text-align: left;
    font-family: 'Jost', sans-serif;
    padding: 0;
  }

  .exercise-row:hover, .exercise-row:active { background: var(--surface2); }

  .exercise-row.done { opacity: 0.55; }

  .exercise-row.done .exercise-row-left { border-left: 3px solid var(--workout); }

  .exercise-row-left {
    flex: 1; padding: 14px 16px;
    border-left: 3px solid transparent;
  }

  .exercise-row-name {
    font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 3px;
    display: flex; align-items: center; gap: 8px;
  }

  .exercise-row-name a {
    font-size: 11px; color: var(--accent-light); text-decoration: none; font-weight: 400;
  }

  .exercise-row-name a:hover { color: var(--accent); }

  .exercise-row-meta { font-size: 12px; font-weight: 300; color: var(--text-muted); margin-bottom: 3px; }

  .exercise-row-prev {
    font-size: 11px; font-weight: 400;
    color: var(--workout); display: inline-block;
  }

  .exercise-row-prev.none { color: var(--text-dim); }

  .exercise-row-logged {
    font-size: 12px; font-weight: 400;
    color: var(--workout); margin-top: 3px;
  }

  .exercise-row-right {
    padding: 14px 14px 14px 0;
    display: flex; align-items: center;
    color: var(--text-dim); font-size: 18px;
  }

  .exercise-row.done .exercise-row-right { color: var(--workout); font-size: 16px; }

  .finish-workout-wrap {
    padding: 16px 20px 28px;
    border-top: 1px solid var(--border);
  }

  .finish-btn {
    width: 100%;
    background: var(--workout);
    color: white;
    border: none;
    border-radius: var(--radius);
    padding: 14px;
    font-family: 'Jost', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.2s;
  }

  .finish-btn:hover { background: #4a7a5a; }
  .finish-btn:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

  /* ── EXERCISE DETAIL SCREEN ── */
  #exerciseScreen { flex-direction: column; }

  .exercise-detail-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .back-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: none;
    color: var(--workout); font-family: 'Jost', sans-serif;
    font-size: 13px; font-weight: 500;
    cursor: pointer; padding: 0;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .back-btn:hover { color: var(--accent); }

  .exercise-detail-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 400;
    color: var(--text); margin-bottom: 4px;
  }

  .exercise-detail-meta {
    font-size: 13px; font-weight: 300; color: var(--text-muted);
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }

  .exercise-detail-meta a { color: var(--accent-light); text-decoration: none; font-size: 12px; }
  .exercise-detail-meta a:hover { color: var(--accent); }

  .exercise-detail-prev {
    font-size: 12px; font-weight: 400;
    color: var(--workout);
    background: var(--workout-dim);
    border-radius: 6px;
    padding: 5px 10px;
    margin-top: 8px;
    display: inline-block;
  }

  .exercise-detail-prev.none { color: var(--text-dim); background: var(--surface2); }

  /* ── SUCCESS ── */
  .success-bubble {
    background: var(--surface);
    border: 1px solid var(--accent-border);
    border-radius: var(--radius);
    padding: 16px; margin-top: 4px;
  }
  .success-bubble .check { font-size: 20px; margin-bottom: 6px; }
  .success-bubble p { font-size: 14px; font-weight: 300; color: var(--text-muted); line-height: 1.5; }
  .success-bubble strong { color: var(--accent); font-weight: 500; }

  /* ── SESSION SELECTION ── */
  .session-list { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }

  .session-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    cursor: pointer;
    text-align: left;
    font-family: 'Jost', sans-serif;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .session-btn:hover, .session-btn:active {
    border-color: var(--workout-border);
    box-shadow: 0 2px 12px rgba(90,138,106,0.1);
  }

  .session-btn-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
  }

  .session-btn-count { font-size: 12px; font-weight: 300; color: var(--text-muted); margin-top: 2px; }
  .session-btn-arrow { color: var(--text-dim); font-size: 20px; }

  /* ── IMD BUTTONS ── */
  .imd-wrap {
    padding: 14px 16px;
    background: var(--surface2);
    border-top: 1px solid var(--border);
    display: none;
  }

  .imd-wrap.visible { display: block; }

  .imd-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .imd-buttons { display: flex; gap: 8px; }

  .imd-btn {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 8px;
    cursor: pointer;
    font-family: 'Jost', sans-serif;
    text-align: center;
    transition: all 0.15s;
  }

  .imd-btn:hover { border-color: var(--workout-border); background: var(--workout-dim); }

  .imd-btn.selected { background: var(--workout); border-color: var(--workout); color: white; }

  .imd-btn-letter { font-size: 18px; font-weight: 500; display: block; margin-bottom: 2px; }
  .imd-btn-label { font-size: 10px; font-weight: 400; color: inherit; display: block; }
  .imd-btn.selected .imd-btn-label { color: rgba(255,255,255,0.8); }

  /* ── DONE EXERCISE BUTTON ── */
  .done-exercise-wrap {
    padding: 0 16px 8px;
    background: var(--bg);
  }

  .done-exercise-btn {
    width: 100%;
    background: none;
    border: 1px solid var(--workout-border);
    border-radius: var(--radius-sm);
    color: var(--workout);
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .done-exercise-btn:hover { background: var(--workout-dim); }

  /* ── BOTTOM BACK BUTTON ── */
  .bottom-back-wrap {
    padding: 16px 20px 28px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  .bottom-back-btn {
    background: var(--workout);
    border: none;
    border-radius: var(--radius);
    color: white;
    font-family: 'Jost', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 14px;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s;
  }

  .bottom-back-btn:hover {
    background: #4a7a5a;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 7px 16px;
    font-size: 13px; font-weight: 400; color: var(--text-muted);
    opacity: 0; transition: all 0.3s ease;
    pointer-events: none; white-space: nowrap; z-index: 100;
    box-shadow: 0 4px 20px rgba(44,39,32,0.08);
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--accent-border); color: var(--accent); }
  .toast.error { border-color: rgba(180,80,80,0.3); color: #a05050; }
</style>
</head>
<body>

<header class="header">
  <button class="logo-btn" onclick="goHome()">Jillian Keaveny Wellness</button>
  <span class="mode-badge morning" id="modeBadge" style="display:none"></span>
</header>

<!-- ── MODE SELECTOR ── -->
<div id="modeScreen">
  <div class="greeting-block">
    <h1>Good <em id="greeting"></em>,<br>let's check in.</h1>
  </div>

  <div class="date-picker-wrap">
    <span class="date-picker-label">Logging for</span>
    <div class="date-row">
      <button class="date-display-btn" onclick="openDatePicker()" id="dateDisplayBtn">
        <span id="dateDisplayText"></span>
        <span class="cal-icon">📅</span>
      </button>
      <input type="date" id="nativeDateInput" class="date-native-input" onchange="onDateChange(this.value)">
      <div class="date-nav">
        <button class="date-nav-btn" onclick="shiftDate(-1)" id="prevDayBtn">‹</button>
        <button class="date-nav-btn" onclick="shiftDate(1)" id="nextDayBtn">›</button>
      </div>
    </div>
  </div>

  <p style="color:var(--text-muted);font-size:13px;font-weight:300;letter-spacing:0.02em;">What are you logging?</p>

  <button class="mode-btn morning" onclick="startCheckin('morning')">
    <div class="btn-label">☀️ Morning</div>
    <div class="btn-title">Morning Check-In</div>
    <div class="btn-desc">Weight, sleep &amp; energy</div>
    <div class="btn-arrow">›</div>
  </button>


  <button class="mode-btn workout" onclick="startWorkout()">
    <div class="btn-label">💪 Workout</div>
    <div class="btn-title">Log Workout</div>
    <div class="btn-desc">View today's program &amp; log sets</div>
    <div class="btn-arrow">›</div>
  </button>


  <button class="mode-btn evening" onclick="startCheckin('evening')">
    <div class="btn-label">🌙 Evening</div>
    <div class="btn-title">Evening Check-In</div>
    <div class="btn-desc">Macros, steps &amp; notes</div>
    <div class="btn-arrow">›</div>
  </button>
</div>

<!-- ── CHECK-IN CHAT ── -->
<div id="chatScreen" class="screen">
  <div class="messages" id="messages">
    <div class="date-display" id="dateDisplay"></div>
    <div class="typing-indicator" id="typingIndicator">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
  </div>
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="userInput" placeholder="Type your answer..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</div>

<!-- ── SESSION SELECTION ── -->
<div id="sessionScreen" class="screen">
  <div class="workout-header">
    <div class="workout-header-top">
      <span class="workout-day-title">Choose Your Workout</span>
    </div>

// ── CONFIG ──────────────────────────────────────────────────────────────────
const CONFIG = {

// ── STATE ────────────────────────────────────────────────────────────────────
let currentMode = null;
let conversationHistory = [];
let checkinComplete = false;
let googleToken = null;
let selectedDate = new Date();

let exerciseLogs = {};

// ── INIT ─────────────────────────────────────────────────────────────────────
function goHome() {
  currentMode = null;
  currentExerciseIdx = null;
  currentSetIdx = 0;

  setBadge(null);

function updateDateDisplay() {
  const today = new Date(); today.setHours(0,0,0,0);
  const sel = new Date(selectedDate); sel.setHours(0,0,0,0);
  const isToday = sel.getTime() === today.getTime();
  const label = selectedDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  document.getElementById('dateDisplayText').innerHTML = isToday
    ? 'Today <span class="today-tag">Today</span>' : label;
  const y = selectedDate.getFullYear();
  const m = String(selectedDate.getMonth() + 1).padStart(2, '0');
  const d = String(selectedDate.getDate()).padStart(2, '0');
  document.getElementById('nativeDateInput').value = y + '-' + m + '-' + d;
  document.getElementById('nextDayBtn').disabled = sel.getTime() >= today.getTime();
}

function openDatePicker() {
  const el = document.getElementById('nativeDateInput');

}

function onDateChange(val) {
  const parts = val.split('-').map(Number);
  selectedDate = new Date(parts[0], parts[1] - 1, parts[2]);
  updateDateDisplay();
}

function shiftDate(days) {
  const nd = new Date(selectedDate);
  nd.setDate(nd.getDate() + days);
  const today = new Date(); today.setHours(23,59,59,999);
  if (nd > today) return;
  selectedDate = nd;
  updateDateDisplay();
}

// ── SCREEN NAVIGATION ────────────────────────────────────────────────────────

    const el = document.getElementById(s);

function setBadge(mode) {

// ── WEEK / COLUMN HELPERS ────────────────────────────────────────────────────
function getWeekIndex(date) {
  const start = new Date(CONFIG.PROGRAM_START); start.setHours(0,0,0,0);
  const d = new Date(date); d.setHours(0,0,0,0);
  return Math.max(0, Math.floor((d - start) / (7 * 24 * 60 * 60 * 1000)));
}

function weekCol(weekIdx) { return 7 + weekIdx * 3; }

function colLetter(idx) {
  if (idx < 26) return String.fromCharCode(65 + idx);
  return String.fromCharCode(64 + Math.floor(idx / 26)) + String.fromCharCode(65 + (idx % 26));
}

// ── CHECKIN FLOW ─────────────────────────────────────────────────────────────
function startCheckin(mode) {

// ── TOAST ────────────────────────────────────────────────────────────────────
function showToast(message, type) {

// ── SEND (CHECK-IN) ──────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || checkinComplete) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

// ── SEND (EXERCISE) ──────────────────────────────────────────────────────────
async function sendExerciseMessage() {
  const input = document.getElementById('exerciseInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('exerciseSendBtn').disabled = true;
  addExerciseMessage('user', text);
  await handleSetInput(text);

function handleExerciseKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendExerciseMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── CLAUDE API (CHECK-IN) ────────────────────────────────────────────────────
async function callClaude(userMessage) {
  showTyping(true);
  const systemPrompt = currentMode === 'morning' ? MORNING_SYSTEM : EVENING_SYSTEM;
  const msgs = conversationHistory.length > 0
    ? conversationHistory
    : [{ role: 'user', content: 'Hello, please begin.' }];

  try {
    const res = await fetch(CONFIG.API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'claude', system: systemPrompt, messages: msgs })
    });
    const data = await res.json();
    showTyping(false);

    if (!data.content || !data.content[0]) {
      showToast('API error: ' + (data.error && data.error.message ? data.error.message : JSON.stringify(data)), 'error');
      return;
    }

    const reply = data.content[0].text;

    if (reply.includes('CHECKIN_COMPLETE:')) {
      const parts = reply.split('CHECKIN_COMPLETE:');
      if (parts[0].trim()) { addMessage('assistant', parts[0].trim()); }
      try { await handleCheckinComplete(JSON.parse(parts[1].trim())); }
      catch(e) { showToast('Error saving. Please try again.', 'error'); }
    } else {
      addMessage('assistant', reply);
      conversationHistory.push({ role: 'assistant', content: reply });
    }
  } catch(err) {
    showTyping(false);
    showToast('Connection error.', 'error');
    console.error(err);
  }
}

// ── CHECKIN COMPLETE ─────────────────────────────────────────────────────────
async function handleCheckinComplete(data) {
  checkinComplete = true;
  document.getElementById('userInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  showToast('Saving...', '');
  try {
    await writeCheckinToSheet(data);
    const messages = document.getElementById('messages');
    const typing = document.getElementById('typingIndicator');
    const div = document.createElement('div');
    div.className = 'message coach';
    div.innerHTML = '<div class="message-label">Fern</div><div class="success-bubble"><div class="check">✓</div><p><strong>All logged!</strong> Your ' + currentMode + ' check-in is saved. See you ' + (currentMode === 'morning' ? 'tonight' : 'tomorrow morning') + '!</p></div>';
    messages.insertBefore(div, typing);
    messages.scrollTop = messages.scrollHeight;
    showToast('Saved ✓', 'success');
  } catch(err) {
    showToast('Could not save. Check console.', 'error');
    console.error(err);
  }
}

// ── WORKOUT FLOW ─────────────────────────────────────────────────────────────
async function startWorkout() {
  setBadge('workout');
  showScreen('sessionScreen');
  document.getElementById('sessionList').innerHTML = '<div style="padding:20px;color:var(--text-muted);font-size:14px;">Loading sessions...</div>';

  try {
    const token = await getGoogleToken();
    const sessions = await loadSessions(token);
    renderSessionList(sessions);
  } catch(err) {
    showToast('Could not load sessions.', 'error');
    console.error(err);
  }
}

async function loadSessions(token) {
  const url = 'https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.SHEET_ID + '/values/Training%20Program!A:G';
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  const data = await res.json();
  if (!data.values) throw new Error('Could not read Training Program');

  const rows = data.values;
  const sessions = [];
  var currentSession = null;
  var exerciseCount = 0;

  for (var i = 0; i < rows.length; i++) {
    const row = rows[i];
    const cellA = (row[0] || '').toString().trim();
    const cellB = (row[1] || '').toString().trim();
    const cellC = (row[2] || '').toString().trim();

    if (!cellA) {
      if (currentSession) {
        sessions.push({ name: currentSession, exerciseCount: exerciseCount });
        currentSession = null;
        exerciseCount = 0;
      }
      continue;
    }

    const isHeader = cellA && !cellB && !cellC &&
      !(row[3] || '').trim() && !(row[4] || '').trim() &&
      !(row[5] || '').trim() && !(row[6] || '').trim();

    if (isHeader) {
      if (currentSession) {
        sessions.push({ name: currentSession, exerciseCount: exerciseCount });
        exerciseCount = 0;
      }
      currentSession = cellA;
    } else if (currentSession && cellA && cellA !== 'Exercise') {
      exerciseCount++;
    }
  }

  if (currentSession) sessions.push({ name: currentSession, exerciseCount: exerciseCount });
  return sessions;
}

function renderSessionList(sessions) {
  const list = document.getElementById('sessionList');
  if (sessions.length === 0) {
    list.innerHTML = '<div style="padding:20px;color:var(--text-muted);font-size:14px;">No sessions found in Training Program tab.</div>';
    return;
  }
  list.innerHTML = '';
  sessions.forEach(function(s) {
    const btn = document.createElement('button');
    btn.className = 'session-btn';
    btn.innerHTML =
      '<div>' +
        '<div class="session-btn-name">' + s.name + '</div>' +
        '<div class="session-btn-count">' + s.exerciseCount + ' exercises</div>' +
      '</div>' +
      '<div class="session-btn-arrow">›</div>';
    btn.onclick = function() { selectSession(s.name); };
    list.appendChild(btn);
  });
}

async function selectSession(sessionName) {
  showScreen('workoutScreen');
  document.getElementById('workoutDayTitle').textContent = sessionName;
  document.getElementById('workoutProgress').textContent = 'Loading...';
  document.getElementById('exerciseList').innerHTML = '';

  try {
    const token = await getGoogleToken();
    workoutExercises = await loadWorkout(token, sessionName);
    exerciseLogs = {};
    workoutExercises.forEach(function(_, i) { exerciseLogs[i] = { sets: [], imd: '', notes: '' }; });
    renderExerciseList();
  } catch(err) {
    showToast('Could not load workout.', 'error');
    console.error(err);
  }
}

function renderExerciseList() {
  const list = document.getElementById('exerciseList');
  const done = Object.values(exerciseLogs).filter(function(l) { return l.sets.length > 0; }).length;
  document.getElementById('workoutProgress').textContent = done + '/' + workoutExercises.length + ' logged';
  document.getElementById('finishBtn').disabled = done === 0;

  list.innerHTML = '';
  workoutExercises.forEach(function(e, idx) {
    const log = exerciseLogs[idx];
    const isDone = log.sets.length > 0;

    const meta = [
      e.sets ? e.sets + ' sets' : '',
      e.reps ? e.reps + ' reps' : '',
      e.rir ? 'RIR ' + e.rir : '',
      e.tempo ? 'Tempo ' + e.tempo : ''
    ].filter(Boolean).join(' · ');

    const btn = document.createElement('button');
    btn.className = 'exercise-row' + (isDone ? ' done' : '');
    btn.onclick = function() { openExercise(idx); };

    const setsDisplay = log.sets.map(function(s) {
      if (s.includes('Right side')) return 'R: ' + s.replace(/^[^:]+:\s*/, '');
      if (s.includes('Left side')) return 'L: ' + s.replace(/^[^:]+:\s*/, '');
      return s.replace(/^[^:]+:\s*/, '');
    }).join(' / ');

    btn.innerHTML =
      '<div class="exercise-row-left">' +
        '<div class="exercise-row-name">' + e.name +
          (e.link ? ' <a href="' + e.link + '" target="_blank" onclick="event.stopPropagation()">▶ Video</a>' : '') +
        '</div>' +
        (meta ? '<div class="exercise-row-meta">' + meta + '</div>' : '') +
        (e.prev
          ? '<div class="exercise-row-prev">📊 Last week: ' + e.prev + '</div>'
          : '<div class="exercise-row-prev none">✨ First time</div>') +
        (isDone ? '<div class="exercise-row-logged">✓ ' + setsDisplay + '</div>' : '') +
      '</div>' +
      '<div class="exercise-row-right">' + (isDone ? '✓' : '›') + '</div>';

    list.appendChild(btn);
  });
}

function metaLine(e) {
  const parts = [
    e.sets ? e.sets + ' sets' : '',
    e.reps ? e.reps + ' reps' : '',
    e.rir ? 'RIR ' + e.rir : '',
    e.tempo ? 'Tempo ' + e.tempo : ''
  ].filter(Boolean);
  return parts.length ? parts.join(' · ') : '';
}

function openExercise(idx) {
  const e = workoutExercises[idx];
  currentExerciseIdx = idx;
  currentSetIdx = 0;

  // Clear exercise messages
  const container = document.getElementById('exerciseMessages');
  const typing = document.getElementById('exerciseTyping');
  while (container.firstChild && container.firstChild !== typing) {
    container.removeChild(container.firstChild);
  }

  // Populate header
  document.getElementById('detailName').textContent = e.name;

  const metaParts = [
    e.sets ? e.sets + ' sets' : '',
    e.reps ? e.reps + ' reps' : '',
    e.rir ? 'RIR ' + e.rir : '',
    e.tempo ? 'Tempo ' + e.tempo : ''
  ].filter(Boolean).join(' · ');

  document.getElementById('detailMeta').innerHTML =
    (metaParts ? '<span>' + metaParts + '</span>' : '') +
    (e.link ? ' <a href="' + e.link + '" target="_blank">▶ Watch video</a>' : '');

  const prevEl = document.getElementById('detailPrev');
  const coachNote = e.coachingNotes ? '📝 ' + e.coachingNotes : '';
  const prevNote = e.prev ? '📊 Last week: ' + e.prev : '✨ First time — no previous data';
  prevEl.innerHTML =
    (coachNote ? '<div style="margin-bottom:4px">' + coachNote + '</div>' : '') +
    '<div>' + prevNote + '</div>';
  prevEl.className = e.prev ? 'exercise-detail-prev' : 'exercise-detail-prev none';

  // Reset IMD panel
  document.getElementById('imdWrap').classList.remove('visible');
  document.querySelectorAll('.imd-btn').forEach(function(b) { b.classList.remove('selected'); });

  // Setup input
  const input = document.getElementById('exerciseInput');
  input.disabled = false;
  input.placeholder = 'e.g. 135x8';
  input.value = '';
  input.oninput = function() {
    document.getElementById('exerciseSendBtn').disabled = this.value.trim() === '';
  };
  document.getElementById('exerciseSendBtn').disabled = true;

  showScreen('exerciseScreen');

  // Build set sequence and prompt first set
  const seq = buildSetSequence(e);
  e._setSequence = seq;

  const existing = exerciseLogs[idx];
  if (existing && existing.sets.length > 0) {
    // Already has some sets — show them and continue
    const logged = existing.sets.map(function(s) {
      return s.replace(/^[^:]+:\s*/, '');
    }).join(' / ');
    addExerciseMessage('assistant', 'You already logged: ' + logged + '\n\nLog ' + seq[existing.sets.length] + ':');
    currentSetIdx = existing.sets.length;
  } else {
    addExerciseMessage('assistant', 'Log ' + seq[0] + ':');
  }

  setTimeout(function() { input.focus(); }, 100);
}

function backToWorkout() {
  // Hide IMD panel
  document.getElementById('imdWrap').classList.remove('visible');
  showScreen('workoutScreen');
  renderExerciseList();
}

function doneWithExercise() {
  // Show IMD buttons
  document.getElementById('imdWrap').classList.add('visible');
  // Clear any selected IMD
  document.querySelectorAll('.imd-btn').forEach(function(b) { b.classList.remove('selected'); });
  // Disable input while selecting IMD
  document.getElementById('exerciseInput').disabled = true;
  document.getElementById('exerciseSendBtn').disabled = true;
  addExerciseMessage('assistant', 'How did you perform compared to last week?');
}

function selectIMD(letter) {
  // Highlight selected button
  document.querySelectorAll('.imd-btn').forEach(function(b) { b.classList.remove('selected'); });
  event.currentTarget.classList.add('selected');

  // Save IMD
  exerciseLogs[currentExerciseIdx].imd = letter;

  // Hide IMD panel, re-enable input, ask for notes
  setTimeout(function() {
    document.getElementById('imdWrap').classList.remove('visible');
    document.getElementById('exerciseInput').disabled = false;
    document.getElementById('exerciseInput').placeholder = 'Notes or questions for your coach...';
    currentSetIdx = -1; // notes mode
    addExerciseMessage('assistant', 'Got it — ' + letter + '. Any notes or questions for your coach? (or say "none")');
    setTimeout(function() { document.getElementById('exerciseInput').focus(); }, 100);
  }, 400);
}

function buildSetSequence(exercise) {
  const setsStr = (exercise.sets || '1').toString().trim().toLowerCase();
  const isSided = setsStr.includes('side');
  const numSets = parseInt(setsStr) || 1;
  const seq = [];
  if (isSided) {
    for (var s = 1; s <= numSets; s++) {
      seq.push('Set ' + s + ' — Right side');
      seq.push('Set ' + s + ' — Left side');
    }
  } else {
    for (var s = 1; s <= numSets; s++) {
      seq.push('Set ' + s);
    }
  }
  return seq;
}

async function handleSetInput(text) {
  const exercise = workoutExercises[currentExerciseIdx];
  const seq = exercise._setSequence || [];
  const log = exerciseLogs[currentExerciseIdx];

  log.sets.push(seq[currentSetIdx] + ': ' + text);
  currentSetIdx++;

  const exerciseInput = document.getElementById('exerciseInput');

  if (currentSetIdx < seq.length) {
    // More sets
    addExerciseMessage('assistant', 'Got it! Now log ' + seq[currentSetIdx] + ':');
    exerciseInput.disabled = false;
    document.getElementById('exerciseSendBtn').disabled = true;
    setTimeout(function() { exerciseInput.focus(); }, 50);
  } else {
    // All sets done — ask for notes
    addExerciseMessage('assistant', 'All sets logged! Any notes or questions for your coach? (form cues, how it felt, questions — or "none")');
    exerciseInput.disabled = false;
    document.getElementById('exerciseSendBtn').disabled = true;
    currentSetIdx = -1; // waiting for notes
    setTimeout(function() { exerciseInput.focus(); }, 50);
  }

  // Check if we were waiting for notes
  if (currentSetIdx === -1 && log.sets.length > 0 && seq.length > 0 && log.sets.length >= seq.length) {
    // Actually we just moved to notes state above — this block handles when notes come in
  }
}

// Override to handle notes state
const _origSend = sendExerciseMessage;
document.addEventListener('DOMContentLoaded', function() {
  // Redefine after load — handled inline via currentSetIdx === -1 check

// Patch handleSetInput to handle notes
async function sendExerciseMessage() {
  const input = document.getElementById('exerciseInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('exerciseSendBtn').disabled = true;
  addExerciseMessage('user', text);

  if (currentSetIdx === -1) {
    // This is the notes response
    const log = exerciseLogs[currentExerciseIdx];
    log.notes = text.toLowerCase() === 'none' ? '' : text;
    addExerciseMessage('assistant', 'Perfect! Tap "Back to Workout" when you\'re ready for the next exercise.');
    document.getElementById('exerciseInput').disabled = true;
    document.getElementById('exerciseSendBtn').disabled = true;
    currentSetIdx = null;
  } else {
    await handleSetInput(text);
  }
}

async function finishWorkout() {
  const workoutData = workoutExercises.map(function(e, i) {
    const log = exerciseLogs[i];
    const sets = log.sets.map(function(s) {
      // Preserve R/L side info: "Set 1 — Right side: 135x8" -> "R: 135x8"
      //                         "Set 1 — Left side: 135x8"  -> "L: 135x8"
      //                         "Set 1: 135x8"              -> "135x8"
      if (s.includes('Right side')) return 'R: ' + s.replace(/^[^:]+:\s*/, '');
      if (s.includes('Left side')) return 'L: ' + s.replace(/^[^:]+:\s*/, '');
      return s.replace(/^[^:]+:\s*/, '');
    }).join(' / ');
    return { name: e.name, sets: sets, notes: log.notes };
  });

  document.getElementById('finishBtn').disabled = true;
  document.getElementById('finishBtn').textContent = 'Saving...';
  showToast('Saving workout...', '');

  try {
    await writeWorkoutToSheet(workoutData);
    showToast('Workout saved ✓', 'success');
    document.getElementById('finishBtn').textContent = 'Saved ✓';

    // Add a success note to the list
    const list = document.getElementById('exerciseList');
    const div = document.createElement('div');
    div.style.cssText = 'padding:20px;text-align:center;color:var(--workout);font-size:14px;font-weight:300;';
    div.textContent = '✓ Workout logged to your sheet!';
    list.appendChild(div);
  } catch(err) {
    showToast('Could not save. Check console.', 'error');
    document.getElementById('finishBtn').disabled = false;
    document.getElementById('finishBtn').textContent = 'Save Workout';
    console.error(err);
  }
}

// ── GOOGLE SHEETS ────────────────────────────────────────────────────────────
async function getGoogleToken() {
  if (googleToken && googleToken.expires > Date.now()) return googleToken.token;
  const res = await fetch(CONFIG.API_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'google_token' })
  });
  const data = await res.json();
  if (!data.token) throw new Error('Could not get Google token');
  googleToken = { token: data.token, expires: Date.now() + 3500000 };
  return googleToken.token;
}

async function findDateRow(token) {
  const ds = (selectedDate.getMonth() + 1) + '/' + selectedDate.getDate() + '/' + String(selectedDate.getFullYear()).slice(-2);
  const url = 'https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.SHEET_ID + '/values/Daily%20Tracker!A:A';
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  const data = await res.json();
  if (!data.values) throw new Error('Could not read sheet');
  for (var i = 0; i < data.values.length; i++) {
    if ((data.values[i][0] || '').toString().trim() === ds) return i + 1;
  }
  throw new Error('No row found for date: ' + ds);
}

async function batchWrite(token, updates) {
  const url = 'https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.SHEET_ID + '/values:batchUpdate';
  const res = await fetch(url, {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      valueInputOption: 'USER_ENTERED',
      data: updates.map(function(u) { return { range: u.range, values: [[u.value]] }; })
    })
  });
  if (!res.ok) { const err = await res.json(); throw new Error(JSON.stringify(err)); }
}

async function writeCheckinToSheet(data) {
  const token = await getGoogleToken();
  const row = await findDateRow(token);
  var updates = [];
  if (currentMode === 'morning') {
    const notes = [
      data.bedtime ? 'Bedtime: ' + data.bedtime : '',
      data.sleepQuality ? 'Sleep quality: ' + data.sleepQuality + '/10' : '',
      data.energy ? 'Energy: ' + data.energy + '/10' : '',
      (data.notes && data.notes.toLowerCase() !== 'none') ? data.notes : ''
    ].filter(Boolean).join(' | ');
    updates = [
      { range: 'Daily Tracker!' + colLetter(DAILY_COLS.morningWeight) + row, value: data.weight },
      { range: 'Daily Tracker!' + colLetter(DAILY_COLS.sleepDuration) + row, value: data.sleepDuration },
      { range: 'Daily Tracker!' + colLetter(DAILY_COLS.notes) + row, value: notes }
    ];
  } else {
    const notes = (data.notes && data.notes.toLowerCase() !== 'none') ? data.notes : '';
    updates = [
      { range: 'Daily Tracker!' + colLetter(DAILY_COLS.protein) + row, value: data.protein },
      { range: 'Daily Tracker!' + colLetter(DAILY_COLS.carbs) + row, value: data.carbs },
      { range: 'Daily Tracker!' + colLetter(DAILY_COLS.fats) + row, value: data.fats },
      { range: 'Daily Tracker!' + colLetter(DAILY_COLS.fiber) + row, value: data.fiber },
      { range: 'Daily Tracker!' + colLetter(DAILY_COLS.calories) + row, value: data.calories },
      { range: 'Daily Tracker!' + colLetter(DAILY_COLS.steps) + row, value: data.steps },
      { range: 'Daily Tracker!' + colLetter(DAILY_COLS.cardio) + row, value: data.cardio },
      { range: 'Daily Tracker!' + colLetter(DAILY_COLS.workoutCompleted) + row, value: data.workoutCompleted },
      { range: 'Daily Tracker!' + colLetter(DAILY_COLS.notes) + row, value: notes }
    ];
  }
  await batchWrite(token, updates);
}

async function loadWorkout(token, sessionName) {
  const weekIdx = getWeekIndex(selectedDate);
  const prevWeekIdx = weekIdx > 0 ? weekIdx - 1 : null;

  // weekCol = 7 + (weekIdx * 3): Weight x Reps
  // weekCol+1: I,M,D
  // weekCol+2: Notes
  const wCol = 7 + (weekIdx * 3);
  const prevWCol = prevWeekIdx !== null ? 7 + (prevWeekIdx * 3) : null;

  // Read enough columns to cover many weeks (A through AZ)
  const url = 'https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.SHEET_ID + '/values/Training%20Program!A:AZ';
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  const data = await res.json();
  if (!data.values) throw new Error('Could not read Training Program');

  const rows = data.values;
  var inSection = false;
  const exercises = [];

  for (var i = 0; i < rows.length; i++) {
    const row = rows[i];
    const cellA = (row[0] || '').toString().trim();
    const cellB = (row[1] || '').toString().trim();
    const cellC = (row[2] || '').toString().trim();

    // Detect this session's header
    if (cellA === sessionName) { inSection = true; continue; }

    if (!inSection) continue;

    // Blank row ends the session
    if (!cellA) break;

    // Another section header ends the session
    const isHeader = cellA && !cellB && !cellC &&
      !(row[3] || '').trim() && !(row[4] || '').trim() &&
      !(row[5] || '').trim() && !(row[6] || '').trim();
    if (isHeader) break;

    // Skip column header row
    if (cellA === 'Exercise') continue;

    const prev = prevWCol !== null ? (row[prevWCol] || '').toString().trim() : '';

    exercises.push({
      name: cellA,
      link: cellB,
      sets: cellC,
      reps: (row[3] || '').toString().trim(),
      rir: (row[4] || '').toString().trim(),
      tempo: (row[5] || '').toString().trim(),
      coachingNotes: (row[6] || '').toString().trim(),
      prev: prev || null,
      rowIndex: i + 1,
      wCol: wCol,
      imdCol: wCol + 1,
      notesCol: wCol + 2
    });
  }
  return exercises;
}

async function writeWorkoutToSheet(workoutData) {
  const token = await getGoogleToken();
  const updates = [];
  workoutData.forEach(function(logged) {
    const exercise = workoutExercises.find(function(e) { return e.name === logged.name; });
    if (!exercise) return;
    if (logged.sets && logged.sets.trim()) {
      updates.push({ range: 'Training Program!' + colLetter(exercise.wCol) + exercise.rowIndex, value: logged.sets });
    }
    if (logged.imd && logged.imd.trim()) {
      updates.push({ range: 'Training Program!' + colLetter(exercise.imdCol) + exercise.rowIndex, value: logged.imd });
    }
    if (logged.notes && logged.notes.trim()) {
      updates.push({ range: 'Training Program!' + colLetter(exercise.notesCol) + exercise.rowIndex, value: logged.notes });
    }
  });
  if (updates.length > 0) await batchWrite(token, updates);
}
